[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-engine"
version = "0.1.0"
description = "A modular algorithm experimentation framework: input → computation → visualization"
readme = "README.md"
authors = [
    { name = "experiment-engine contributors" },
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "plotly>=5.14",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/example/experiment-engine"
Source = "https://github.com/example/experiment-engine"

[tool.setuptools.packages.find]
where = ["src"]
include = ["experiment_engine*"]

[tool.setuptools.package-data]
"experiment_engine" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
