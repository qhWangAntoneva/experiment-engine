[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-engine"
version = "0.1.0"
description = "A modular algorithm experimentation framework: input → computation → visualization"
readme = "README.md"
authors = [
    { name = "experiment-engine contributors" },
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "plotly>=5.14",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/qhWangAntoneva/experiment-engine"
Source = "https://github.com/qhWangAntoneva/experiment-engine"
Documentation = "https://github.com/qhWangAntoneva/experiment-engine#readme"
"Bug Tracker" = "https://github.com/qhWangAntoneva/experiment-engine/issues"

[project.entry-points."experiment_engine.algorithms"]

[project.entry-points."experiment_engine.loaders"]

[project.entry-points."experiment_engine.visualizers"]

[project.entry-points."experiment_engine.reporters"]

[project.scripts]
experiment-engine = "experiment_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["experiment_engine*"]

[tool.setuptools.package-data]
"experiment_engine" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PD",
    "RUF",   # Ruff-specific rules (refactoring, diagnostics)
    "C4",    # flake8-comprehensions
    "T20",   # flake8-print
    "RET",   # flake8-return
    "SLF",   # flake8-self (private member access)
]
ignore = ["B008", "ARG001", "ARG002"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["T201"]  # Allow print in tests
"examples/*.py" = ["T201"]  # Allow print in examples

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
strict_optional = true
no_implicit_reexport = true
disallow_untyped_defs = false
warn_unreachable = true
strict_equality = true
