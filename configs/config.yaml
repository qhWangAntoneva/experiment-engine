# experiment-engine — Example Configuration
#
# This is a sample YAML configuration for running an experiment.
# Copy this as a starting point for your own experiments.

name: experiment
description: Example experiment using linear regression
version: "1.0"

stages:
  - name: load_data
    stage_type: csv_loader
    enabled: true
    params:
      format: csv
      path: examples/data.csv
      delimiter: ","

  - name: analyze
    stage_type: linear_regression
    enabled: true
    params:
      fit_intercept: true
      normalize: false

  - name: visualize
    stage_type: visualizer
    enabled: true
    params:
      backends:
        - matplotlib
        - plotly
      output_dir: results/figures/

global_params: {}

output_dir: results/

verbose: false
